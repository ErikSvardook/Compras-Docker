#Para que funcione en localhost se debe quitar o comentar la linea 13: SET transaction_timeout = 0; de V1__init.sql en el backend
services:
  postgres:
    image: postgres:16
    container_name: erp-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../Compras_Backend

    container_name: erp-backend

    ports:
      - "8081:8081"

    depends_on:
      - postgres

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SERVER_PORT: ${SERVER_PORT}

  frontend:
    build:
      context: ../Compras_Frontend-Angular

    container_name: erp-frontend-angular

    ports:
      - "4200:80"

    depends_on:
      - backend

volumes:
  postgres_data: